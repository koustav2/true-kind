# /etc/nginx/sites-available/truekind
#
# POST-CERTBOT version of this vhost — this is what is actually installed on
# truehr once `certbot --nginx -d truekind.truehr.co.in` has run. Use this file,
# not deploy/nginx-truekind.conf (which is port-80-only and would delete the
# certificate lines below).
#
# Every "# managed by Certbot" line and marker is preserved verbatim so that
# `certbot renew` keeps recognising and updating this file.
server {
    server_name truekind.truehr.co.in;   # change to truekindfoundation.org when bought

    # 210m, not the original 5m. The CMS accepts video uploads up to 200 MB
    # (server/utils/media.js enforces the real per-type ceilings). At 5m nginx
    # rejected them with its own HTML 413 before Node saw a single byte, so the
    # admin got an unstyled error page with no explanation.
    client_max_body_size 210m;

    # A slow phone upload of a 200 MB file needs longer than nginx's 60s default,
    # or the connection is dropped mid-transfer.
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream the upload straight through to Node instead of buffering the
        # whole video to disk first, and allow time for it to finish.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/truekind.truehr.co.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/truekind.truehr.co.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = truekind.truehr.co.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name truekind.truehr.co.in;
    return 404; # managed by Certbot


}
