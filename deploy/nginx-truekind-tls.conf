# /etc/nginx/sites-available/truekind
#
# POST-CERTBOT version of this vhost. Use this file, not
# deploy/nginx-truekind.conf (which is port-80-only and would delete the
# certificate lines below).
#
# TWO DOMAINS, ON PURPOSE.
#
#   truekindfoundation.org   — canonical. Serves the site.
#   truekind.truehr.co.in    — the old host. 301s to the canonical one.
#
# The old host is NOT decommissioned, and it must not be. Every membership card,
# certificate, appointment letter and receipt printed before the move carries a
# QR code pointing at truekind.truehr.co.in — the URL was baked into the image
# at the moment the PDF was generated. Those documents are on lanyards and in
# filing cabinets and cannot be recalled. Stop answering on that hostname and
# every one of them becomes unverifiable: a member holds up a card, somebody
# scans it, and the phone reports nothing there. That looks like a forgery.
#
# So the old name keeps a certificate and keeps redirecting, and a scan of an
# old card lands on the new site with the serial intact. Keep it for as long as
# any printed document is in circulation, which for an ID card valid a year is
# at least a year past the last one printed. There is no hurry to remove it —
# a redirect costs nothing.
#
# The redirect is 301 and the path is preserved, so /verify/TKF-M-2026-D5AE0C
# arrives at the same path on the new host. All three names go on one
# certificate:
#
#   certbot --nginx -d truekindfoundation.org -d www.truekindfoundation.org \
#                   -d truekind.truehr.co.in
#
# ⚠ CHECK THE CERTIFICATE PATH BELOW AFTER RUNNING CERTBOT.
#
#   ls /etc/letsencrypt/live/
#
# Certbot names the directory after the FIRST -d, so the command above gives
# .../live/truekindfoundation.org/ — which is what this file expects. BUT if a
# certificate for truekind.truehr.co.in already existed, certbot may offer to
# EXPAND that one instead of starting a new lineage, and then the directory
# keeps the old name (.../live/truekind.truehr.co.in/) even though the cert now
# covers all three domains. Either is fine; the paths in this file just have to
# match whatever `ls` actually shows, or nginx -t fails on a missing file.
#
# Every "# managed by Certbot" line and marker is preserved verbatim so that
# `certbot renew` keeps recognising and updating this file.

# ---------------------------------------------------------------------------
# Canonical host — this is the one that serves.
# ---------------------------------------------------------------------------
server {
    server_name truekindfoundation.org www.truekindfoundation.org;

    # 210m, not the original 5m. The CMS accepts video uploads up to 200 MB
    # (server/utils/media.js enforces the real per-type ceilings). At 5m nginx
    # rejected them with its own HTML 413 before Node saw a single byte, so the
    # admin got an unstyled error page with no explanation.
    client_max_body_size 210m;

    # A slow phone upload of a 200 MB file needs longer than nginx's 60s default,
    # or the connection is dropped mid-transfer.
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream the upload straight through to Node instead of buffering the
        # whole video to disk first, and allow time for it to finish.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/truekindfoundation.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/truekindfoundation.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ---------------------------------------------------------------------------
# The old host, over HTTPS. Redirects, preserving the path.
#
# It needs its own TLS block, not just a port-80 one: the QR codes on printed
# documents encode https://truekind.truehr.co.in/verify/..., so the scan arrives
# on 443. Without a certificate valid for this name the phone shows a security
# warning before it ever reaches the redirect, which is worse than a 404 — it
# tells the person holding the card that something is wrong with it.
# ---------------------------------------------------------------------------
server {
    server_name truekind.truehr.co.in;

    return 301 https://truekindfoundation.org$request_uri;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/truekindfoundation.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/truekindfoundation.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ---------------------------------------------------------------------------
# Port 80, both names -> HTTPS on the canonical host.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name truekindfoundation.org www.truekindfoundation.org truekind.truehr.co.in;

    # ACME challenges must be answerable over plain HTTP for renewal. Certbot's
    # nginx plugin handles this itself while it runs; this location makes a
    # webroot renewal work too, and costs nothing.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://truekindfoundation.org$request_uri; }
}
