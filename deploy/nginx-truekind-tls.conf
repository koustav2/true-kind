# /etc/nginx/sites-available/truekind   —   STEP 2 OF 2, the final shape
#
# TWO DOMAINS, TWO CERTIFICATES, ON PURPOSE.
#
#   truekindfoundation.org   — canonical. Serves the site.
#                              cert lineage: truekindfoundation.org
#   truekind.truehr.co.in    — the old host. 301s to the canonical one.
#                              cert lineage: truekind.truehr.co.in  (the one that
#                              already exists on this box — untouched)
#
# EACH BLOCK USES A CERTIFICATE THAT ACTUALLY COVERS ITS OWN NAMES, and that is
# the whole point of keeping two lineages rather than expanding one. An earlier
# draft of this file pointed both blocks at the new lineage, which would have
# served a truekindfoundation.org certificate to anyone arriving on
# truekind.truehr.co.in — a name mismatch, so the browser throws a full-page
# security warning before it ever reaches the redirect. On a scanned ID card that
# reads as "this card is fraudulent", which is precisely the failure this file
# exists to prevent. Two lineages, two renewals, no mismatch.
#
# WHY THE OLD HOST IS NOT DECOMMISSIONED
#
# Every membership card, certificate, appointment letter and receipt printed
# before the move carries a QR code containing
# https://truekind.truehr.co.in/verify/… — the URL was baked into the image when
# the PDF was generated. Those documents are on lanyards and in filing cabinets
# and cannot be recalled. Stop answering on that hostname and every one of them
# becomes unverifiable.
#
# The redirect is 301 and preserves the path, so /verify/TKF-M-2026-D5AE0C
# arrives at the same path on the new host. Keep it for as long as any printed
# document is in circulation — for a one-year card, at least a year past the last
# one printed. A redirect costs nothing.
#
# The old host needs its own TLS block rather than only a port-80 one because
# those printed QRs are https:// — the scan arrives on 443, and without a
# matching certificate the phone warns before the redirect can happen.
#
# The `# managed by Certbot` markers are preserved so `certbot renew` keeps
# recognising this file.

# ---------------------------------------------------------------------------
# Canonical host — this is the one that serves the application.
# ---------------------------------------------------------------------------
server {
    server_name truekindfoundation.org www.truekindfoundation.org;

    # 210m, not the original 5m. The CMS takes video up to 200 MB
    # (server/utils/media.js enforces the real per-type ceilings). At 5m nginx
    # rejected the upload with its own HTML 413 before Node saw a single byte.
    client_max_body_size 210m;

    # A slow phone upload of 200 MB needs longer than nginx's 60s default.
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream the upload through to Node instead of buffering it to disk.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/truekindfoundation.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/truekindfoundation.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ---------------------------------------------------------------------------
# The old host over HTTPS — redirect only, on its OWN existing certificate.
# ---------------------------------------------------------------------------
server {
    server_name truekind.truehr.co.in;

    return 301 https://truekindfoundation.org$request_uri;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/truekind.truehr.co.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/truekind.truehr.co.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ---------------------------------------------------------------------------
# Port 80, all three names -> HTTPS on the canonical host.
#
# The ACME location stays. Both certificates renew from this one block, and a
# renewal that cannot answer a challenge fails silently until the certificate
# expires — which is a 3am problem, ninety days from now, on a site nobody
# touched. Leave it.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name truekindfoundation.org www.truekindfoundation.org truekind.truehr.co.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / { return 301 https://truekindfoundation.org$request_uri; }
}
