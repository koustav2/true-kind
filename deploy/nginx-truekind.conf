# /etc/nginx/sites-available/truekind
# Until the client buys a domain, use a subdomain of the box you own:
#   truekind.truehr.co.in  -> add an A record to 66.116.242.17
server {
    listen 80;
    server_name truekind.truehr.co.in;   # change to truekindfoundation.org when bought

    # 5m was the old value and it silently capped the CMS: any video over 5 MB
    # was rejected by nginx with its own HTML 413 before Node saw a byte, so the
    # admin got an unstyled error page and no explanation. Node enforces the
    # real per-type ceilings (6 MB images, 200 MB video) in utils/media.js.
    client_max_body_size 210m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream large uploads straight through instead of buffering the whole
        # video to disk first, and give a slow phone upload time to finish.
        proxy_request_buffering off;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        client_body_timeout   300s;
    }

    # Uploaded media: long cache (filenames are random and never reused) and
    # keep the nosniff header Node sets, so an uploaded file can never be
    # reinterpreted as script on this origin.
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options nosniff always;
    }
}
# After DNS resolves, add SSL:  sudo certbot --nginx -d truekind.truehr.co.in
