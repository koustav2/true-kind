# /etc/nginx/sites-available/truekind
# Until the client buys a domain, use a subdomain of the box you own:
#   truekind.truehr.co.in  -> add an A record to 66.116.242.17
server {
    listen 80;
    server_name truekind.truehr.co.in;   # change to truekindfoundation.org when bought

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# After DNS resolves, add SSL:  sudo certbot --nginx -d truekind.truehr.co.in
