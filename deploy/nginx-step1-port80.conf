# /etc/nginx/sites-available/truekind   —   STEP 1 OF 2
#
# Port 80 only, all three names. This exists for one job: certbot validates a
# domain by fetching http://<domain>/.well-known/acme-challenge/… over plain
# HTTP, so nginx has to already answer on truekindfoundation.org before a
# certificate for it can be issued. A config that only knows the old hostname
# cannot be used to get a certificate for the new one.
#
# Paste this, reload, run certbot, then replace it with
# deploy/nginx-truekind-tls.conf (step 2), which adds the TLS blocks and the
# redirect from the old host.
#
# BACK UP FIRST — if a certbot-managed config is already installed, this file
# overwrites its certificate lines:
#
#   cp /etc/nginx/sites-available/truekind ~/nginx-truekind-$(date +%F).bak
#
# The site is briefly HTTP-only between step 1 and step 2. Do both in one
# sitting; do not stop halfway.

server {
    listen 80;
    listen [::]:80;
    server_name truekindfoundation.org www.truekindfoundation.org truekind.truehr.co.in;

    # Let certbot answer its own challenge over HTTP. The --nginx plugin handles
    # this itself while it runs, but leaving the location here also makes a
    # webroot renewal work, and costs nothing.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # 210m, not the default. The CMS accepts video up to 200 MB and nginx
    # otherwise rejects the upload with its own HTML 413 before Node sees a byte.
    client_max_body_size 210m;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
