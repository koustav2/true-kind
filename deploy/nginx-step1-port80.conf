# /etc/nginx/sites-available/truekindfoundation-acme   —   STEP 1 OF 2
#
# A SEPARATE, TEMPORARY vhost. Do not copy this over the existing `truekind`
# file — that one already has a live certbot-managed `listen 443 ssl` block, and
# replacing it would take HTTPS down on a site that is currently working.
#
# WHY A SEPARATE FILE
#
# certbot proves you control a domain by fetching
# http://<domain>/.well-known/acme-challenge/<token> over plain HTTP. Nothing on
# this box answers for truekindfoundation.org yet, and there is no
# `default_server` anywhere in the nginx config — which means an unmatched Host
# falls through to the FIRST server block nginx parsed, and on this machine that
# is api.truehr.co.in. So without this file the challenge lands on the API vhost
# and validation fails.
#
# Adding the new names to the existing truekind vhost instead would be worse: its
# port-80 block ends in `return 404` (certbot writes that), so the challenge
# would be 404'd by our own config.
#
# Everything that is not an ACME challenge redirects to the site as it stands
# today, so the new domain is usable the moment DNS resolves, before its
# certificate exists.
#
# INSTALL
#   mkdir -p /var/www/html
#   cp deploy/nginx-step1-port80.conf /etc/nginx/sites-available/truekindfoundation-acme
#   ln -sf /etc/nginx/sites-available/truekindfoundation-acme /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# REMOVE once step 2 is in place — the final vhost covers port 80 itself:
#   rm /etc/nginx/sites-enabled/truekindfoundation-acme
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name truekindfoundation.org www.truekindfoundation.org;

    # The only thing this vhost really exists to serve.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Until the new certificate exists, send visitors to the working site rather
    # than serving the app over plain HTTP on a name whose cookie settings do not
    # match. $request_uri keeps the path, so a link into /portal still lands.
    location / {
        return 302 https://truekind.truehr.co.in$request_uri;
    }
}
